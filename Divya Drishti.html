<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divya Drishti – ज्ञान ही एकमात्र मार्ग है आध्यात्मिक दृष्टि जाग्रत करने का</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@500;600&display=swap">
<style>
:root{--bg:#f6f2fb;--surface:#fff;--ink:#241838;--muted:#665a7c;--accent:#9a3b8f;--gold:#b97a0b;--line:#e3d9f0;--fact:#fff6dd;--factb:#e0a82e;--warn:#fde9e7;--warnb:#d6453b;--hdr:rgba(246,242,251,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#130b22;--surface:#1e1233;--ink:#f0e8fb;--muted:#b6a7cf;--accent:#e58be0;--gold:#f4c453;--line:#35264f;--fact:#2c2210;--factb:#f4c453;--warn:#341718;--warnb:#ff7a70;--hdr:rgba(19,11,34,.92)}}
:root[data-theme="dark"]{--bg:#130b22;--surface:#1e1233;--ink:#f0e8fb;--muted:#b6a7cf;--accent:#e58be0;--gold:#f4c453;--line:#35264f;--fact:#2c2210;--factb:#f4c453;--warn:#341718;--warnb:#ff7a70;--hdr:rgba(19,11,34,.92)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.15;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--ink);text-decoration:none;font:700 21px "Cormorant Garamond",Georgia,serif}
header a span{color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
.hero{background:linear-gradient(160deg,#25104a,#5b1f6b 60%,#9a3b6f);color:#fff;padding:36px 0 30px}
.hero .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.hero .tx{flex:1 1 280px}
.hero h1{font-size:clamp(36px,8vw,60px);font-weight:700}
.hero h1 em{color:#ffd36b}
.hero p{color:#eadcff;max-width:46ch;margin:14px 0 0}
.hero svg{width:150px;flex:0 0 auto}
.intro{padding:26px 0 6px}
.intro h2{font-size:30px}
.intro p{color:var(--muted);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:18px 0 40px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:18px}
.card:hover,.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--c);font-size:22px;margin-bottom:10px}
.card h3{font-size:25px}
.card p{margin:6px 0 10px;color:var(--muted);font-size:15px;line-height:1.55}
.go{color:var(--accent);font-weight:600;font-size:14px}
.art-h{background:linear-gradient(160deg,#25104a,var(--c));color:#fff;padding:28px 0 24px}
.art-h h1{font-size:clamp(34px,7vw,52px)}
.art-h p{margin:8px 0 0;color:#f0e6ff}
.back{display:inline-block;margin:0 0 10px;color:#ffe29a;text-decoration:none;font-weight:600;font-size:14px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
article{padding:24px 0 10px}
article h3{font-size:30px;color:var(--accent);margin:26px 0 6px}
article p,article li{max-width:68ch}
article ul{padding-left:20px}
article li{margin:6px 0}
article b{color:var(--gold)}
blockquote{margin:20px 0;padding:6px 0 6px 18px;border-left:4px solid var(--accent);font:italic 500 24px/1.35 "Cormorant Garamond",Georgia,serif}
.fact,.warn{border-left:5px solid var(--factb);background:var(--fact);padding:12px 16px;border-radius:0 10px 10px 0;margin:20px 0;max-width:68ch}
.warn{border-color:var(--warnb);background:var(--warn)}
.fact>b,.warn>b{display:block;color:var(--ink)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.diag{display:block;margin:18px auto;width:190px}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0}
.nav button{font:600 15px Inter,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:20px 0 30px;text-align:center}
@media (prefers-reduced-motion:no-preference){.hero svg{animation:glow 4s ease-in-out infinite alternate}@keyframes glow{to{filter:drop-shadow(0 0 12px #ffd36b88)}}}
.gh{font-size:32px;margin:26px 0 0;color:var(--accent)}
.intro{padding-top:20px}.intro .fact{max-width:none}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface);color:var(--gold);white-space:nowrap}
td:first-child{font-weight:600}
article ol{padding-left:22px}article ol li::marker{color:var(--gold);font-weight:700}
article small{color:var(--muted)}
.hero .tgl{font:italic 600 clamp(22px,5vw,30px)/1.3 "Cormorant Garamond","Noto Sans Devanagari",Georgia,serif;color:#ffd36b;margin:10px 0 0}
.pic{display:block;max-width:100%;height:auto;border-radius:16px}
.hero .pic{flex:0 0 auto;width:min(320px,86vw);box-shadow:0 0 44px #ffd36b44}
.pic.big{width:min(440px,100%);margin:18px auto}
.hn a{font:600 14px Inter,'Noto Sans Devanagari',sans-serif;margin-left:16px;color:var(--accent)}
.me{display:flex;gap:16px;align-items:center;margin-bottom:6px}.me h2{font-size:36px}.me p{margin:2px 0 0;color:var(--muted)}
.av{flex:0 0 auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8e24aa,#ffb300);color:#fff;font:700 32px 'Cormorant Garamond',Georgia,serif}
article a{color:var(--accent)}
details.qa{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0;max-width:68ch}
details.qa summary{cursor:pointer;font-weight:600}details.qa p{margin:8px 0 2px}
textarea{width:100%;max-width:68ch;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:block;margin:8px 0}
.btn{font:600 15px Inter,sans-serif;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;margin-right:6px}
.pq{border:1px dashed var(--factb);border-radius:10px;padding:10px 14px;margin:10px 0;max-width:68ch}.pq p{margin:0 0 6px;font-weight:600}
.mut{color:var(--muted);font-size:14px}
/* chakra logos: round icon on the cards, full logo at the top of each chakra page */
.ic.has-img{width:76px;height:76px;background:#140b1f;box-shadow:0 0 0 2px var(--c),0 6px 16px rgba(0,0,0,.28);margin-bottom:12px;overflow:hidden}
.ic.has-img img{display:block;width:100%;height:100%;object-fit:cover}
.pic.logo{box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.25)}
</style>
</head>

const TOPICS=[
{g:0,id:"what-is-kundalini",title:"What is Kundalini? (कुंडलिनी क्या है)",icon:"🐍",color:"#8e24aa",sum:"The coiled Shakti, asleep at the base of the body.",
body:`<p>Kundalini is the Shakti, the divine power, that tantric and yogic texts picture as asleep at the base of the body until practice or grace wakes her.</p><ul>
<li><b>The word:</b> from Sanskrit kuṇḍala, “ring” or “coil”. Kuṇḍalinī means “the coiled one” and is always feminine.</li>
<li><b>The image:</b> a serpent coiled three and a half times around a self-born lingam (स्वयंभूलिंग) in the Muladhara, her mouth blocking the entrance to the central channel.</li>
<li><b>The coils:</b> three can mean the three gunas, or waking, dream and deep sleep, with the half coil for the state beyond. Another reading ties them to OM: A, U, M and the silent half-beat.</li>
<li><b>What she is:</b> each person’s share of Shakti, the creative power of consciousness. Shiva (शिव) is pure consciousness; Shakti is its power to act. Yoga aims to reunite the two.</li>
<li><b>Levels:</b> a supreme kundalini identical with consciousness, a subtle one tied to prana and breath, and the bodily one practitioners feel. Schemes vary by author.</li>
<li><b>Where she sits:</b> most texts say the base of the spine; some name the navel, and certain medieval sources the heart.</li></ul>
${F("One word, many meanings","Sravana Borkataky-Varma and Anya Foxen show there has never been one authentic model of kundalini. Christopher Wallis argues classical Tantra described a dynamic process of Shakti, not an energy waiting dormant at the base. Treat any single definition as one tradition’s view.")}
${F("Status","A traditional framework of practice and experience, not an anatomical finding.")}`},
{g:0,id:"history-sources",title:"History and Sources (इतिहास और स्रोत)",icon:"📜",color:"#fb8c00",sum:"A scheme that grew over about a thousand years.",
body:`<p>The scheme grew over roughly a thousand years in tantric and yogic texts, and the familiar six-plus-one form settled only in the 16th century.</p>
${tb("Date|Source|What it adds",["First millennium BCE|Chandogya, Prasna, Katha Upanishads|Channels (nadis) radiate from the heart; the Katha counts 101, one rising to the crown","7th–8th c. CE|Svacchanda Tantra|Early, detailed map of the subtle body, unlike later schemes","c. 950–1016|Abhinavagupta, Tantraloka|Chakras as consciousness at different degrees of contraction, not fixed anatomy","Medieval|Kaula texts, Nath yogis|Chakras inside goddess ritual; Naths carry the teaching into mainstream yoga","14th–15th c.|Yogachudamani Upanishad|Kundalini as a sleeping goddess; 72,000 nadis rise from an egg-like bulb below the navel","15th c.|Hatha Yoga Pradipika|A practical manual: breath, bandhas and mudras","16th c.|Sat-Cakra-Nirupana (Purnananda Yati)|The standard six chakras plus the crown, with petals, seeds, deities, elements","Late medieval|Yoga-Kundalini Upanishad|Moderate diet, posture, shakti-chalana; three knots; a guru is essential","1919|The Serpent Power (Woodroffe)|The English translation that shaped nearly all Western knowledge of chakras"])}
${F("Good to know","The oldest sources speak of nadis, not chakras. Kurt Leland found Indian systems with as few as four and as many as forty-nine chakras. Much teaching passed orally, so texts give a partial picture. Tibetan Buddhist tantra also works with channels and centres (Six Yogas of Naropa), so these ideas are not only Hindu.")}`},
{g:0,id:"subtle-body",title:"The Subtle Body (सूक्ष्म शरीर)",icon:"☯️",color:"#1e88e5",sum:"Bodies, sheaths, prana, nadis and the three knots.",
body:`<p>Yoga describes a person as three bodies, five sheaths and a web of channels carrying prana. Kundalini travels through only one channel.</p>
<h3>Three bodies, five sheaths</h3><p><b>Sthula</b> (physical), <b>Sukshma</b> (subtle: mind, intellect, senses, prana) and <b>Karana</b> (causal, the seed of both).</p>
${tb("Kosha|Meaning|Worked through",["Annamaya (अन्नमय)|Food sheath, physical body|Diet, asana","Pranamaya (प्राणमय)|Vital-energy sheath|Pranayama","Manomaya (मनोमय)|Mind sheath|Mantra, japa","Vijnanamaya (विज्ञानमय)|Wisdom, discernment|Study, self-inquiry","Anandamaya (आनन्दमय)|Bliss sheath|Meditation, devotion"])}
<h3>Prana and five vayus</h3><p>Prana (प्राण) is the life force on the breath. <b>Prana</b>: heart, chest, intake. <b>Apana</b>: lower abdomen, elimination. <b>Samana</b>: navel, digestion. <b>Udana</b>: throat and head, upward movement, speech. <b>Vyana</b>: whole body, circulation.</p>
<h3>Nadis (नाड़ी)</h3><p>The word means “little river”. Counts differ: 72,000 (Hatha Yoga Pradipika, Goraksha Samhita), 350,000 with 14 principal (Shiva Samhita), 101 from the heart (Upanishads). All rise from the heart or the kanda (कंद), an egg-shaped bulb below the navel.</p>
<ul><li><b>Ida (इडा):</b> left, lunar, cooling; left nostril; the Ganga.</li><li><b>Pingala (पिङ्गला):</b> right, solar, heating; right nostril; the Yamuna.</li><li><b>Sushumna (सुषुम्ना):</b> central, Muladhara to Sahasrara; the Sarasvati. Inside it lie the Vajra, Chitrini and Brahma nadi, kundalini’s actual path.</li><li><b>Triveni (त्रिवेणी):</b> the three meet at the Ajna.</li></ul>
${F("Myth check","Ida and Pingala crossing at every chakra is a later teaching. Hiroshi Motoyama found no traditional text describes their paths in detail.")}
<h3>Three knots (ग्रंथि)</h3><ul><li><b>Brahma</b>, around the Muladhara: attachment to body and survival.</li><li><b>Vishnu</b>, around the heart: attachment to feeling and relationships.</li><li><b>Rudra</b>, around the Ajna: attachment to the subtle ego and to powers.</li></ul><p>These meanings are teachers’ explanations, not fixed doctrine.</p>`},
{g:1,id:"seven-chakras",title:"The Seven Chakras at a Glance (सात चक्र)",icon:"🌈",color:"#ab47bc",sum:"Places, petals, elements and seeds in one table.",
body:`<p>The Sat-Cakra-Nirupana describes six chakras plus the crown. Tap a chakra card below for its full page.</p>{{CHAKRA}}
${tb("Chakra|Place|Petals, letters|Element|Seed",["Muladhara|Between genitals and anus|4: व श ष स|Earth, yellow square|LAM","Svadhisthana|Root of genitals|6: ब भ म य र ल|Water, white half-moon|VAM","Manipura|Root of navel|10: ड ढ ण त थ द ध न प फ|Fire, red triangle|RAM","Anahata|Heart|12: क ख ग घ ङ च छ ज झ ञ ट ठ|Air, six-cornered figure|YAM","Vishuddha|Throat|16 vowels|Ether, white circle|HAM","Ajna|Between eyebrows|2: ह क्ष|Mind (manas)|OM","Sahasrara|Crown|1,000|Beyond elements|Bindu, void"])}
${F("Key fact","The petals on the six chakras total 50, one for each letter of the Sanskrit alphabet.")}
<h3>Colours and themes</h3>
${tb("Chakra|Classical lotus|Modern colour|Modern theme",["Muladhara|Crimson|Red|Grounding","Svadhisthana|Vermilion|Orange|Sensuality","Manipura|Heavy rain-clouds|Yellow|Empowerment","Anahata|Deep red, Bandhuka flower|Green|Compassion","Vishuddha|Smoky purple|Blue|Communication","Ajna|White like the moon|Indigo|Intuitive insight","Sahasrara|Whiter than the full moon|Violet|Enlightenment"])}
<p>The rainbow order and one-word qualities were first joined in print in 1977 (Leland). Classical and modern layers differ, so they are marked apart on each chakra page.</p>`},
...chakraPages,
{g:2,id:"awakening",title:"Kundalini Awakening (कुंडलिनी जागरण)",icon:"🧘",color:"#43a047",sum:"The classical path: rising, piercing and union.",
body:`<p>The classical texts describe kundalini rising through the Sushumna, piercing three knots and meeting Shiva at the crown, after long preparation.</p>
<h3>The classical path</h3><ol><li><b>Preparation:</b> moderate food, posture, shakti-chalana; yama and niyama first (v. 50). The ill or injured should not practise.</li><li><b>Opening the door:</b> kundalini’s mouth covers the Brahma-dvara. Breath control and bandhas turn prana into that channel.</li><li><b>Waking:</b> the yogi rouses her with the sound Hum and places her in the Brahma-dvara (v. 50).</li><li><b>Piercing:</b> she pierces three lingams (v. 51), paired with the knots of Brahma, Vishnu and Rudra.</li><li><b>Dissolving:</b> all things absorb into her as she rises (v. 52).</li><li><b>Union:</b> she reaches Shiva at the Sahasrara and brings the bliss of liberation (v. 51).</li><li><b>Return:</b> she goes back to the Muladhara; the yogi offers the nectar to his ishta-devata (v. 53).</li></ol>
<h3>How it is said to begin</h3><ul><li><b>Practice:</b> hatha, raja, kriya or mantra yoga, gradually.</li><li><b>Guru’s transmission (शक्तिपात):</b> by touch, glance, word or will, as in Kashmir Shaivism and Siddha Yoga.</li><li><b>Devotion or grace:</b> the text ends with devotion to the guru and ishta-devata.</li><li><b>Spontaneously:</b> in a survey of 152 people the triggers were turmoil or trauma (52%), meditation (47%), nature (22%), past psychedelics (22%), yoga (18%) and near-death experience (13%).</li></ul>
<h3>What people report</h3><p>Heat or energy rising along the spine; tingling at crown, brow and heart; electric sensations; light; spontaneous movements. Positive reports: expansion, bliss, a changed sense of self. Challenging ones: panic, disorganised thinking, burning heat, involuntary movements, unusual perceptions.</p>
${W("Powers and a warning","The text lists powers as fruits of each centre. Patanjali calls such powers obstacles to samadhi (Yoga Sutra 3.37). The Yoga-Kundalini Upanishad warns against “absurd and impossible notions” and ends in Self-knowledge and living liberation (jivanmukti).")}`},
{g:2,id:"practices",title:"Practices (साधना)",icon:"🙏",color:"#fb8c00",sum:"A ladder from preparation to meditation, taught person to person.",
body:`<p>Classical practice is a ladder of preparation, purification, posture, breath, seals and meditation.</p>
${tb("Rung|What it is|Notes",["Preparation|Yama, niyama, sattvic food, regular sleep, satsang|The Upanishad starts with moderate food","Purification|Neti, dhauti, nauli, trataka, kapalabhati|Clear the nadis; learn from a teacher","Asana|Steady seat: siddhasana, padmasana, vajrasana|Listed in the Upanishad","Pranayama|Nadi shodhana, ujjayi, surya bhedana, sitali, bhastrika, bhramari; kumbhaka|Retention is advanced","Bandhas|Mula, uddiyana, jalandhara; together, maha bandha|Named in the Upanishad","Mudras|Ten in the Hatha Yoga Pradipika, e.g. maha mudra, khechari, vajroli, shakti chalani|Advanced; teacher-taught","Mantra|Seed syllables, so’ham (hamsa), ishta mantra, japa|Seeds are on the chakra pages","Meditation|Dharana on a chakra, inner sound (nada), trataka, yoga nidra|Anahata links with inner sound","Devotion, service|Bhajan, kirtan, nama-japa, seva|Bhakti reaches the same goal"])}
<h3>Modern lineages</h3><ul><li><b>Kundalini Yoga (Yogi Bhajan, 3HO):</b> brought to the US in 1968; sets of postures, breath, mantra and meditation called kriyas. Philip Deslippe argues it was a synthesis, not an inherited lineage.</li><li><b>Others:</b> Swami Sivananda (1935 book), kriya yoga (Lahiri Mahasaya, Yogananda), Siddha Yoga (Muktananda), Bihar School (Satyananda Saraswati).</li></ul>
${F("Research","A randomized trial found a Kundalini yoga programme helped adults with generalized anxiety, though less than CBT.")}`},
{g:2,id:'shiva-samhita',title:'Kundalini in the Shiva Samhita (शिव संहिता)',icon:'📖',color:'#c77d1a',sum:'What the Shiva Samhita says about Kundalini, with chapter and verse.',
body:`<p>The Shiva Samhita is a hatha yoga text in five chapters, taught by Shiva to Parvati. It calls itself both a yoga text and a tantra. Chapter 2 maps the body, chapter 3 gives breath practice and the four stages of yoga, chapter 4 teaches the mudras that raise Kundalini, and chapter 5, the longest, describes Kundalini and the lotuses. James Mallinson places its composition between about 1300 and 1500 CE, probably near Varanasi, in the Sri Vidya tradition. Some scholars date it later.</p>
${F('How to read the references','Numbers like 2.23 mean chapter 2, verse 23, in S. C. Vasu’s 1914 English translation (online text at universal-path.org). Mallinson’s 2007 critical edition (YogaVidya) numbers some verses differently, so where I checked it I add “M” with the verse and the book page. All points are paraphrased.')}
${F('सार','शिव संहिता के अनुसार कुंडलिनी मूलाधार कमल की योनि में साढ़े तीन कुंडलियों में सुषुम्ना के मुख पर सोई है। गुरु-कृपा, मुद्रा और प्राणायाम से जाग्रत होकर वह ग्रंथियों का भेदन करती हुई ब्रह्मरंध्र से बाहर निकलती है।')}
<h3>Where she lives and what she is</h3>
${tb('Topic|Verses|What the text says',['Seat|2.21–23; 5.56–57|The Adhara (root) lotus sits two finger-widths above the anus and two below the generative organ, four fingers wide. Its centre holds a triangular yoni, and there dwells Kundalini, coiled three and a half times like a serpent, at the mouth of the Sushumna. With her tail in her own mouth, she rests in its hole.','Nature|2.24; 5.58–59|She is the creative force of the world and the goddess of speech, whom speech cannot express. She sleeps, shining by her own light, and is called the power (shakti) of Vishnu and the mother of the three gunas.','The hole of Brahma|2.18–19; 4.14; 5.124|Inside the Sushumna runs the Chitra nadi, shining with five colours, with the subtle hollow Brahmarandhra. The sleeping goddess lies at its mouth, and Kundalini is its inner force.','Root lotus|5.62–64|Near the self-born linga (swayambhu-linga) lies the region called Kula, with the adept Dviranda and the goddess Dakini. The seed of love (kama-bija) shines above the yoni.','Channels|2.13–16; 2.25–27|There are 350,000 nadis, fourteen of them principal. Ida, Pingala and Sushumna are the chief, and Sushumna is the highest, dearest to yogis. Ida and Pingala coil round it, and it has six stages and six lotuses.','Moon and sun|2.6–12; 5.103–108|Nectar drips from the moon at the top of the spine. The sun at the base of the spine consumes it, and a heating “poison” flows through Pingala. Practices such as Jalandhara bandha (4.38) aim to stop the nectar being burned up.'])}
<h3>Awakening and rising</h3>
${tb('Step or practice|Verses|What the text says',['Awakening by grace|4.13 (M 4.21, p. 77)|When the sleeping goddess is awakened through the guru’s grace, all the lotuses and bonds are pierced.','Why mudras|4.14 (M 4.22, p. 77)|To wake the goddess asleep at the mouth of the Brahmarandhra, the mudras must be practised with the greatest care.','The ten best mudras|4.15 (M 4.23–24, p. 77)|Mahamudra, Mahabandha, Mahavedha, Khechari, Jalandhara, Mulabandha, Viparitakarani, Uddiyana, Vajroli and Shaktichalana. Mallinson notes that Vasu omits Vajroli, and restores it at M 4.78–104.','Mahamudra|4.17–18 (M 4.30–34, p. 80)|Stirs all the vessels of the body. Mallinson’s list of results includes the heating of Kundalini; Vasu’s wording differs.','Mahabandha|4.21–22|Joins prana and apana with samana at the navel, and the wind enters the Sushumna.','Mahavedha|4.23–26 (M 4.44–46, p. 84)|The wind pierces the knot on the path of Sushumna and then the knot of Brahma. The gods in the chakras tremble, and Kundalini is absorbed in Kailasa. Mahamudra and Mahabandha bear no fruit without it (4.27).','Shaktichalana|4.53–57|Draw up the goddess sleeping in the Adhara lotus with the apana vayu. Leaving sleep, she rises by herself (4.55). Daily practice is said to lengthen life and remove disease (4.54).','Breath and stages|3.26–29; 3.60–61|After three months of nadi purification the first stage, arambha, begins. In the third stage, parichaya, the air stays steady in the Sushumna and the yogi pierces the six chakras.','Dharana on six centres|3.64|Hold concentration for five ghatis at each of the Muladhara, Svadhisthana, navel, heart, throat and the space between the eyebrows.','The final exit|5.127–128|All the nadis are bound by eight knots, and only Kundalini can pierce them and pass out through the Brahmarandhra. This happens when the air is fully confined in the vessels.','Union|5.151–157|The thousand-petalled lotus lies outside the body, on mount Kailas, where Shiva dwells. There the kula-kundalini force is absorbed, and then creation is absorbed in the Supreme Self.'])}
<h3>The six lotuses in chapter 5</h3>
${tb('Lotus|Verses|Petals, colour|Adept and goddess',['Muladhara (Adhara)|5.63–69|4 petals|Dviranda; Dakini','Svadhisthana|5.75–78|6 petals, blood-red|Bala; Rakini','Manipura|5.79–82|10 petals, golden|Rudra; Lakini','Anahata|5.83–89|12 petals, deep blood-red; flame called Banalinga|Pinaki; Kakini','Vishuddha|5.90–95|16 vowels, brilliant gold|Chhagalanda; Sakini','Ajna|5.96–119|2 petals (h, ksh); seed syllable “tham”|Shukla Mahakala; Hakini','Sahasrara|5.120–123; 5.151–152|1,000 petals; at the root of the palate (5.120), and outside the body (5.151)|Shiva as Nakula'])}
${F('Colours differ from the modern scheme','This text gives blood-red, golden, deep blood-red and brilliant gold for the lotuses (5.75, 79, 83, 90), not the modern rainbow. It also says contemplating the Ajna alone gives all the fruits of the other five (5.115).')}
<h3>Teacher, stages and seekers</h3>
<ul><li><b>Guru first:</b> knowledge from the guru’s own lips is powerful, otherwise it is weak and painful (3.11). Success needs belief, faith, respect for the guru, equality, restraint of the senses and moderate eating, with no seventh condition (3.18).</li><li><b>Four stages:</b> arambha (3.27), ghata, where prana and apana, nada and bindu, jivatma and paramatma combine (3.55–56), parichaya (3.60–61) and nishpatti (3.66–67).</li><li><b>Four seekers:</b> mild, moderate, ardent and most ardent (5.10–14). The ardent are said to succeed in about six years and the most ardent in about three. The four yogas are Mantra, Laya, Hatha and Raja (5.9).</li><li><b>Householders:</b> may succeed too, if they practise without attachment (5.186–187, 5.210–212).</li><li><b>Seed mantras:</b> one each in the root lotus, the heart and the Ajna (5.190–191). The text does not name them; the translator gives aim, klim and strim. Take mantra from a guru.</li><li><b>Inner sounds:</b> bee, flute, harp, bells and thunder, leading to absorption in nada (5.27).</li></ul>
<h3>Two river maps</h3><p>The usual map makes Ida the Ganga, Pingala the Yamuna and Sushumna the Sarasvati, meeting at the Triveni (5.131–139). Another makes Ida and Pingala the rivers Varana and Asi, with Varanasi between them (5.100–105). Mallinson reads this second map as a sign that the text was composed near Varanasi.</p>
${W('Read with care','Mallinson calls the text a compilation whose teachings sometimes contradict each other. For example, its lists of obstacles differ (3.33 and 5.3–8; M 3.35–37), and 5.5 even lists trying to awaken Kundalini by rapid belly movement among the obstacles of “knowledge”. He also says Vasu’s translation is often inaccurate, and that the Kundalini and mantra passage at M 5.79–83 is corrupt in the manuscripts. Powers such as rising in the air or conquering death are traditional claims, not verified facts. Do not attempt retention, Khechari, Uddiyana or Shaktichalana from a book.')}
<p><small>Sources: S. C. Vasu, The Siva Samhita (1914), online text at universal-path.org/Shiva_Samhita. James Mallinson, The Shiva Samhita: A Critical Edition and an English Translation (YogaVidya, 2007), introduction and chapter 4 excerpt.</small></p>`},
{g:2,id:"no-guru",title:"If No Guru Is Available (गुरु उपलब्ध न हो तो)",icon:"🧭",color:"#d6453b",sum:"Safe self-study, substitutes for a guru and working rules.",
body:`<p>No classical text recommends teaching yourself the kundalini-specific techniques, but the same texts leave wide, safer ground open to self-study and name several substitutes.</p>
${W("Health first","People with heart disease, high blood pressure, epilepsy, glaucoma or other eye disease, pregnancy or a psychiatric history should take medical advice before even the gentle tier.")}
${tb("Tier|Examples|Self-study?",["Foundation|Yama, niyama, regular sleep, moderate food, steady seat, natural breath awareness, japa, bhajan, seva|Yes, with moderation","Gentle breath, meditation|Alternate-nostril breathing without holding, humming breath, mantra meditation, short sessions|Yes, slowly; stop if dizzy, anxious or restless","Energetic techniques|Kumbhaka, long forceful breathing, bandha combinations, khechari, maha vedha, vajroli, chakra-piercing visualisation, fasting, tantric sexual practice|Not without a qualified teacher","Initiation|Mantra diksha, shaktipat|From a guru or by grace; do not self-initiate"])}
${F("Why the third line is firm","Hatha Yoga Pradipika 2.15–17 says breath is controlled by slow degrees, as a lion, elephant or tiger is tamed, or it harms the practitioner: hiccups, asthma, cough, and pain in head, ears and eyes.")}
<h3>What the tradition accepts in place of a guru</h3><ul><li><b>The inner guide:</b> Gita 18.61 says the Lord dwells in every heart; bhakti treats the ishta-devata as guru.</li><li><b>The Name:</b> chanting Ram nam or Hari nam is open to all and needs no kundalini technique.</li><li><b>A human guide:</b> a qualified sant, priest or pandit; a senior practitioner; satsang.</li><li><b>A teacher at a distance:</b> lessons from a lineage whose training and conduct you can check.</li><li><b>Nature and life:</b> the avadhuta of the Bhagavata Purana names 24 teachers, including the earth, the sun and a bee.</li><li><b>Other paths:</b> the Gita offers devotion, selfless action and knowledge to the same goal.</li></ul>
<h3>Books and their cautions</h3><ul><li><b>Hatha Yoga Pradipika</b> (Akers, Pancham Sinh, or Bihar School edition): guru-taught pranayama, gradual progress.</li><li><b>Yoga-Kundalini Upanishad</b> (Satyadharma Saraswati commentary): guru essential; obstacles listed.</li><li><b>Asana Pranayama Mudra Bandha</b> (Satyananda): precautions for each practice.</li><li><b>Light on Pranayama</b> (Iyengar): retention is an advanced step.</li><li><b>Gita ch. 6, Yoga Sutras:</b> moderation and ethics before technique.</li><li><b>Roots of Yoga</b> (Mallinson, Singleton): what the sources actually say.</li><li><b>Gopi Krishna, Sannella:</b> accounts of spontaneous awakening; read to understand the risks.</li></ul>
<h3>Eight working rules if you practise alone</h3><ol><li>Keep sessions 10 to 20 minutes; add time before intensity.</li><li>Keep the breath natural; stop if dizzy, panicky or tingling out of control.</li><li>Keep life steady: regular sleep and meals, no fasting or sleep loss.</li><li>Do not chase sensations; heat, tingling or light means slow down.</li><li>Skip retention kriyas, khechari, vajroli, maha vedha, tantric sex practice, one-session awakenings and drugs.</li><li>Keep a log of sleep, mood and sensations; review monthly.</li><li>See a doctor for physical symptoms and a mental-health professional for fear, confusion or unusual perceptions.</li><li>Revisit after six to twelve months; seek a teacher for anything beyond the foundation.</li></ol>`},
{g:3,id:"other-traditions",title:"Other Traditions (अन्य परंपराएँ)",icon:"🌏",color:"#00897b",sum:"Different lineages count the centres differently.",
body:`<p>The six-plus-one scheme is one map among many. Christopher Wallis argues that one correct chakra system is a modern idea; the original texts offer several models, each tied to its own ritual and philosophy.</p>
${tb("Tradition|Centres|Note",["Sat-Cakra-Nirupana (Shakta, 16th c.)|Six plus the crown|The modern yoga standard","Siddha Siddhanta Paddhati (Nath)|Nine|Body as a microcosm of mountains, rivers, sacred sites","Rudrayamala|Six, plus smaller wheels|Four small wheels inside the Muladhara’s petals","Kaula, Kashmir Shaiva|Varied|Chakras in goddess ritual; Abhinavagupta reads them as consciousness","Buddhist tantra†|Often four: navel, heart, throat, crown|Inner heat (tummo); Six Yogas of Naropa","Taoist practice†|Three dantian|Microcosmic orbit resembles channel-cleansing","Sufi orders†|Lataif|Counted differently by order","Theosophy, Western esotericism|Seven|Plexuses, glands, later rainbow colours; Gichtel’s 1701 diagram","Modern syncretism|Seven|Adds sefirot, tarot, gemstones"])}
<p><small>† General scholarly knowledge; not checked against a source.</small></p>`},
{g:3,id:"philosophy",title:"Philosophy: Shiva and Shakti (दर्शन)",icon:"🔱",color:"#5c6bc0",sum:"How Tantra, Vedanta and Bhakti read the same path.",
body:`<ul><li><b>Shiva and Shakti:</b> Shiva is pure consciousness; Shakti is its power to act and know itself. Abhinavagupta grounds chakras in consciousness (cit) and self-expression (vimarsha), not fixed anatomy. The Yogachudamani Upanishad states the aim as making Shiva and Shakti one within oneself.</li>
<li><b>The 36 tattvas:</b> Kashmir Shaivism lists 36 principles from Shiva to earth (Samkhya has 25). Kundalini’s ascent reverses the descent, each element dissolving into its source.†</li>
<li><b>Sound and letters:</b> the 50 petals carry the 50 Sanskrit letters (मातृका), so the chakra map is a map of sound. Tantra speaks of four levels of speech, from silent para to spoken vaikhari.†</li>
<li><b>Shakta and Shri Vidya:</b> kundalini is the goddess herself, Lalita Tripurasundari. The Lalita Sahasranama names her in each centre, e.g. Hakini at the Ajna.</li>
<li><b>Raja yoga and Vedanta:</b> Patanjali names a few places for concentration (navel, throat, heart, crown light) but not kundalini or six chakras.† Advaita puts Self-knowledge first and treats energy practices as optional aids.†</li>
<li><b>Bhakti:</b> union through love and surrender. Verse 44 lets each tradition name the goal its own way.</li>
<li><b>Bhoga and moksha:</b> many tantric paths treat body and world as the field of practice; ascetic schools stress renunciation.†</li></ul><p><small>† General scholarly knowledge; not checked against a source.</small></p>`},
{g:3,id:"correspondences",title:"Astrology, Ayurveda and Correspondences (ज्योतिष, आयुर्वेद)",icon:"⭐",color:"#f9a825",sum:"Which links are classical and which are later overlays.",
body:`${F("Key point","Most links between chakras and planets, doshas, gems and colours are later overlays. The classical text ties each chakra to an element, letters, a seed sound, a deity and a Shakti.")}
<h3>Classical anchors</h3><ul><li><b>Elements and senses:</b> earth, water, fire, air, ether from Muladhara to Vishuddha, with smell, taste, sight, touch, hearing.†</li><li><b>Sun and moon:</b> Ida and Pingala are Sasi and Mihira, moon and sun (v. 1). Surya bhedana builds on this pairing.</li><li><b>Seven worlds:</b> manuals pair the centres with Bhu, Bhuvar, Svar, Mahar, Jana, Tapa, Satya.† The verses read do not state this.</li></ul>
<h3>Ayurveda</h3><p>Vata is air and ether, Pitta fire and water, Kapha earth and water. A derived reading: Muladhara and Svadhisthana with Kapha, Manipura with Pitta, Anahata and Vishuddha with Vata. The Sat-Cakra-Nirupana does not make this pairing.†</p>
<h3>Jyotish: planets often paired†</h3>
${tb("Chakra|Planets",["Muladhara|Saturn, Mars or Ketu","Svadhisthana|Moon, Venus or Jupiter","Manipura|Sun or Mars","Anahata|Venus, Moon or Sun","Vishuddha|Mercury","Ajna|Jupiter, or Sun and Moon","Sahasrara|Ketu, Sun or Saturn"])}
<p>There is no standard planet-to-chakra map; authors disagree. <b>Ashlesha</b> (आश्लेषा), the ninth nakshatra (16°40′ to 30° Cancer), has the Nagas as deity, a coiled serpent as symbol and Mercury as ruler. Some link it and Rahu and Ketu with kundalini symbolism; this is symbolic, not classical doctrine.†</p>
<p><small>† General knowledge; approximate, not checked against a source. Gems, rudraksha, colours and notes belong to the later layer of Western esotericism and alternative healing.</small></p>`},
{g:3,id:"science",title:"Modern History, Psychology and Science",icon:"🔬",color:"#26a69a",sum:"How the 20th century reshaped it, and what research shows.",
body:`<p>Twentieth-century teachers reshaped the scheme. Science has studied the experiences and practices but has not found chakras or nadis as body structures.</p>
${tb("Year|Event",["1880s–1920s|Theosophists (Blavatsky, Leadbeater) build the seven-chakra scheme and link it to plexuses and endocrine glands","1927|Leadbeater’s The Chakras: chakras as clairvoyantly seen vortices","1932|Jung’s Zurich seminar: kundalini symbols as stages of individuation","1967|Gopi Krishna, Kundalini: The Evolutionary Energy in Man","1968|Yogi Bhajan begins teaching “Kundalini Yoga” in the US","1976|Lee Sannella, Kundalini: Psychosis or Transcendence?","1977|Ken Dychtwald, Bodymind: first print union of rainbow colours with chakra qualities","2008|Kundalini Awakening Scale, a 76-item questionnaire","2025|The Serpent’s Tale (Columbia University Press): kundalini as many models"])}
<ul><li><b>Anatomy:</b> no body structure matching a chakra or nadi has been identified. The plexus and gland links came from Theosophists and colour healers, not Indian texts.</li>
<li><b>Experience research:</b> in a survey of 152 people, kundalini awakenings were more physical (heat, involuntary movements) but not significantly more negative. 90.8% rated the experience positive short term, 98% long term. The sample was self-selected and relied on recall.</li>
<li><b>Clinical trial:</b> 226 adults with generalized anxiety. At 12 weeks, 54% responded to Kundalini yoga, 71% to CBT, 33% to stress education; at six months 63%, 77%, 48%. CBT stays first-line. The trial tested a practice, not whether kundalini exists.</li></ul>
${W("Health claims","“Balancing” chakras is never mentioned in the scriptures, and no clinical trial shows that blocked chakras cause illness.")}`}
];

const QA=[
{q:'Is kundalini a real snake in the body?',a:'No. The serpent is a symbol. Texts picture kundalini as a serpent coiled three and a half times around a self-born lingam in the Muladhara, but it stands for Shakti, the creative power of consciousness, not an animal or a physical organ.'},
{q:'Is kundalini awakening dangerous?',a:'It can be, if forced. Strong practices can bring panic, burning heat, sleeplessness or involuntary movements. The Hatha Yoga Pradipika (2.15–17) says breath must be controlled by slow degrees, like taming a lion, or it harms the practitioner. Go gently, keep life steady, and see a doctor or mental-health professional if you feel unwell.'},
{q:'Can I awaken kundalini without a guru?',a:'No classical text recommends teaching yourself the kundalini-specific techniques. A safe foundation is open to everyone: ethical living, regular sleep, moderate food, a steady seat, natural breath awareness, japa and seva. Skip breath retention, khechari, vajroli and chakra-piercing visualisation unless a qualified teacher guides you.'},
{q:'Are chakras scientifically proven?',a:'No body structure matching a chakra or nadi has been identified. The links to nerve plexuses and glands came from Theosophists and colour healers in the early 1900s, not from the Indian texts. Chakras are a traditional framework of practice and experience.'},
{q:'How many chakras are there?',a:'Modern teaching counts seven. The classical Sat-Cakra-Nirupana describes six plus the crown. Across Indian systems, scholars found counts from four to forty-nine, so no single count is the only correct one.'},
{q:'Do the rainbow colours of the chakras come from ancient texts?',a:'No. The classical text gives other lotus colours, for example crimson for the Muladhara. The rainbow order joined with one-word qualities like “grounding” was first printed in 1977 (Leland).'},
{q:'Can balancing chakras cure illness?',a:'The idea of “balancing” chakras is never mentioned in the scriptures, and no clinical trial shows that blocked chakras cause illness. A Kundalini yoga programme helped adults with anxiety, though less than CBT. For illness, see a doctor first.'}
];
const ABOUT=`<div class='me'><div class='av'>AV</div><div><h2>Arvind Vaishnav</h2><p>M.Sc. in Life Sciences. Researcher of Kundalini, Shakti and Yoga for 15+ years.</p></div></div>
<h3>Namaste, I am Arvind Vaishnav</h3><p>I completed my M.Sc. in Life Sciences, and for more than 15 years I have been researching Kundalini, Shakti and the yogas. Divya Drishti is where I share what I have learned, clearly and honestly.</p>
<h3>My background</h3><p>Life Sciences taught me to ask for evidence, to separate what is observed from what is assumed, and to check a source before believing it. I bring the same habit to a subject where tradition, personal experience and later additions often get mixed together. That is why this website marks the classical text apart from the modern layer, and flags what is not verified.</p>
<h3>15+ years of study and practice</h3><ul><li>I have read many texts and ancient books on Kundalini, Shakti and yoga.</li><li>I have practised many things myself, not only studied them.</li><li>I compare classical sources with modern teaching, to see what is old and what was added later.</li></ul>
<h3>Why I made this website</h3><p>Recently, a lot has changed. On YouTube, Instagram and other platforms, many people give fake knowledge and wrong data without any prior knowledge, only for publicity and views. A beginner who trusts them can pick up false ideas or unsafe practices.</p>
${F('My purpose','I created Divya Drishti so that you do not fall into the trap of fake knowledge. Real knowledge is the only way to awaken the spiritual vision. ज्ञान ही एकमात्र मार्ग है।')}
<h3>My promise to you</h3><ul><li>I name my sources, with the text and verse where I can.</li><li>I mark classical teaching apart from modern additions.</li><li>I mark with † anything I could not check.</li><li>Safety comes first, and I say clearly when a practice needs a teacher.</li><li>Where traditions disagree, I tell you so.</li></ul>
<h3>How to spot fake spiritual content</h3><ol><li><b>No source.</b> Ask which text, chapter and verse. “Ancient secret” is not a source.</li><li><b>Fast awakening.</b> Promises of kundalini in days, or in one session, are a warning sign.</li><li><b>Modern ideas sold as ancient.</b> Rainbow chakra colours, gems and planet links are later additions.</li><li><b>No safety.</b> Real teachers talk about preparation, limits and a guide.</li><li><b>Miracle cures.</b> No trial shows that blocked chakras cause illness.</li><li><b>Selling urgency.</b> Pressure to buy a course or “secret technique” is built for views and money.</li></ol>
<p>Have a doubt? Visit <a href='#qa' data-id='qa'>Questions and Answers</a> and ask me.</p>`;
let subs=[];
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function qaHTML(){return `<p>Common questions, answered. Tap a question to open it.</p>${QA.map(x=>`<details class='qa'><summary>${x.q}</summary><p>${x.a}</p></details>`).join('')}<h3>Questions from visitors</h3><div id='vq'><p class='mut'>Loading…</p></div>`}
function page(id){subs.forEach(f=>f());subs=[];cur=id;const t=PAGES.find(x=>x.id===id);
 app.innerHTML=`<section class='art-h' style='--c:${t.color}'><div class='wrap'><button class='back' data-home>← All topics</button><h1>${t.title}</h1><p>${t.sum}</p></div></section><div class='wrap'><article>${id==='about'?ABOUT:qaHTML()}</article></div>`;
 window.scrollTo(0,0);if(id==='qa')qaLive()}
async function qaLive(){
 let db=null,user=null;
 try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
 const box=document.getElementById('vq');if(!box||cur!=='qa')return;
 if(!db){box.innerHTML=`<p class='mut'>Visitor questions are not available in this view yet.</p>`;return}
 const own=!!(user&&user.isOwner());
 box.innerHTML=`<div id='ans'></div>${own?`<h3>Waiting for your answer</h3><div id='pend'></div>`:''}<h3>Ask your question</h3><textarea id='qt' rows='3' maxlength='500' placeholder='Type your question here'></textarea><button class='btn' id='qs'>Send question</button><p class='mut' id='qm'></p>`;
 subs.push(db.collection('answers').orderBy('ts','desc').limit(50).onSnapshot(s=>{const el=document.getElementById('ans');if(!el)return;el.innerHTML=s.docs.map(d=>{const x=d.data();return `<details class='qa'><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`}).join('')},()=>{}));
 if(own){const P={};subs.push(db.collection('asked').orderBy('ts','desc').limit(50).onSnapshot(s=>{const el=document.getElementById('pend');if(!el)return;el.innerHTML=s.docs.length?s.docs.map(d=>{P[d.id]=d.data().q;return `<div class='pq'><p>${esc(d.data().q)}</p><textarea rows='3' placeholder='Write your answer'></textarea><button class='btn' data-pub='${d.id}'>Publish answer</button><button class='btn' data-del='${d.id}'>Delete</button></div>`}).join(''):`<p class='mut'>No new questions.</p>`},()=>{}));
  box.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.pub||b.dataset.del;if(!id)return;
   try{if(b.dataset.pub){const a=b.parentNode.querySelector('textarea').value.trim();if(!a)return;await db.collection('answers').add({q:P[id],a,ts:Date.now()})}await db.doc('asked/'+id).delete()}catch(x){b.textContent='Failed, try again'}})}
 document.getElementById('qs').onclick=async()=>{const t=document.getElementById('qt'),m=document.getElementById('qm'),q=t.value.trim();if(q.length<5)return;try{await db.collection('asked').add({q,ts:Date.now()});t.value='';m.textContent='Thank you. Your question was sent and will be answered here.'}catch(x){m.textContent='Could not send your question. Please try again later.'}}}
const app=document.getElementById("app");
let cur="";
function card(t){return `<a class="card" href="#${t.id}" data-id="${t.id}" style="--c:${t.color}"><span class="ic${t.img?" has-img":""}">${t.img?`<img src="${t.img}" alt="" width="76" height="76">`:t.icon}</span><h3>${t.title}</h3><p>${t.sum}</p><span class="go">Read more</span></a>`}

  app.innerHTML=`<section class="hero"><div class="wrap"><div class="tx"><h1>Divya <em>Drishti</em></h1><p class="tgl">ज्ञान ही एकमात्र मार्ग है आध्यात्मिक दृष्टि जाग्रत करने का</p><p>Kundalini and the chakras: the dormant energy yoga and Tantra place at the base of the spine, and the centres through which it is said to rise to the crown.</p></div>${chakraSVG()}</div></section>
  <div class="wrap"><div class="intro">${F("सार","कुंडलिनी वह सुप्त दिव्य शक्ति है जिसे योग और तंत्र में रीढ़ के आधार (मूलाधार) पर साढ़े तीन कुंडलियाँ मारकर सोई हुई सर्पिणी के रूप में बताया गया है। सुषुम्ना के मार्ग पर सात चक्र (मूलाधार, स्वाधिष्ठान, मणिपूर, अनाहत, विशुद्ध, आज्ञा, सहस्रार) इस शक्ति के पड़ाव माने जाते हैं। साधना, प्राणायाम, मंत्र और गुरु-कृपा से जाग्रत होकर कुंडलिनी तीन ग्रंथियों का भेदन करती हुई सहस्रार में शिव से मिलती है। यह मार्ग संयम और योग्य गुरु के मार्गदर्शन में ही अपनाना चाहिए।")}</div>
  ${G.map((g,i)=>`<h2 class="gh">${g}</h2><div class="grid">${TOPICS.filter(t=>t.g===i).map(card).join("")}</div>`).join("")}<h2 class="gh">Ask and Know | पूछें और जानें</h2><div class="grid">${PAGES.map(card).join("")}</div></div>`;
  window.scrollTo(0,0);

function show(id){
  if(id==="about"||id==="qa"){page(id);return}
  const i=TOPICS.findIndex(t=>t.id===id);
  if(i<0){home();return}
  cur=id;const t=TOPICS[i],p=TOPICS[i-1],n=TOPICS[i+1];
  const cards=id==="seven-chakras"?`<div class="grid">${TOPICS.filter(x=>x.g===1&&x.id!==id).map(card).join("")}</div>`:"";
  app.innerHTML=`<section class="art-h" style="--c:${t.color}"><div class="wrap"><button class="back" data-home>← All topics</button><h1>${t.title}</h1><p>${t.sum}</p></div></section>
  <div class="wrap"><article>${t.body.replace("{{CHAKRA}}",chakraSVG().replace('class="pic"','class="pic big"'))}</article>${cards}
  <div class="nav">${p?`<button data-id="${p.id}">← ${p.title.split(" (")[0].split(":")[0]}</button>`:"<span></span>"}${n?`<button data-id="${n.id}">${n.title.split(" (")[0].split(":")[0]} →</button>`:"<span></span>"}</div></div>`;
  window.scrollTo(0,0);
}
function go(id){
  try{location.hash=id}catch(e){}
  id==="home"?home():show(id);
}
document.addEventListener("click",e=>{
  const h=e.target.closest("[data-home]");if(h){e.preventDefault();go("home");return}
  const a=e.target.closest("[data-id]");if(a){e.preventDefault();go(a.dataset.id)}
});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id&&id!==cur)id==="home"?home():show(id)});
const start=location.hash.slice(1);
start&&start!=="home"?show(start):home();
